services:
  careersignal:
    build: .
    ports:
      - "8000:8000"
    environment:
      CAREERSIGNAL_HOST: 0.0.0.0
    volumes:
      - careersignal-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  careersignal-data:
